[flake8]
max-line-length = 120
ignore = F405

[tox]
envlist = smoke,integration
pytest_display_ops = -vv --color=yes
pytest_report_ops = --junitxml=build/test-results/{envname}.xml
pytest_compute_ops = --timeout={env:PYTEST_TIMEOUT:300} --timeout-method=thread -n {env:NPROC:8}
pytest_tempdir_ops = --basetemp=build/pytest/tox/{envname}
pytest_ops = {[tox]pytest_display_ops} {[tox]pytest_report_ops} {[tox]pytest_compute_ops} {[tox]pytest_tempdir_ops}

[testenv:smoke]
extras = tests
commands = pytest {[tox]pytest_display_ops} {[tox]pytest_report_ops} {[tox]pytest_tempdir_ops} -rs -m "smoke" tests/integration {posargs}

[testenv:integration]
extras = tests
commands = pytest {[tox]pytest_ops} -rs tests/integration {posargs}

# End-to-end and Model Compiler acceptance need resource-specific environments.
# Run their documented tests/README.md commands directly instead of isolated tox envs.
