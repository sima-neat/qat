[pytest]
addopts =
  --strict-config
  --strict-markers
  --import-mode=importlib
  --basetemp=build/pytest/integration
cache_dir = build/pytest-cache
testpaths = tests/integration
xfail_strict = true
markers =
  smoke: marks the smallest installed API and lifecycle checks
  slow: marks long-running training or compilation tests
  gpu: marks tests that require a visible CUDA GPU
  network: marks tests that may download uncached datasets or assets
  model_compiler: marks opt-in tests that produce SiMa Model Compiler artifacts
